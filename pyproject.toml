[project]
name = "control-combustible"
version = "1.0.0"
description = "Sistema de control de compra de combustible"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
# B008: patrón idiomático de FastAPI (Depends/Query como valores por defecto).
ignore = ["B008"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
