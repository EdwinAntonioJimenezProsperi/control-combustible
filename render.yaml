# Configuración para desplegar en Render (https://render.com).
# Crea un servicio web + una base de datos Postgres gratuita.
services:
  - type: web
    name: control-combustible
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: COOLDOWN_DAYS
        value: "7"
      - key: MAX_LITROS
        value: "100"
      - key: DATABASE_URL
        fromDatabase:
          name: combustible-db
          property: connectionString

databases:
  - name: combustible-db
    plan: free
    databaseName: combustible
